# Todd's Sporting Goods — Printavo revenue dashboard
# Netlify site config.

[build]
  publish   = "public"
  functions = "netlify/functions"

# Password gate — runs before everything, protects pages AND /api/* data.
[[edge_functions]]
  path     = "/*"
  function = "gate"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/data"
  to   = "/.netlify/functions/get-data"
  status = 200

[[redirects]]
  from = "/api/backfill"
  to   = "/.netlify/functions/backfill-background"
  status = 200

[[redirects]]
  from = "/api/test"
  to   = "/.netlify/functions/test-connection"
  status = 200
